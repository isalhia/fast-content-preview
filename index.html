
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast Content AI Portal</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        h1 {
            color: #00ffd5;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        .button {
            padding: 12px 24px;
            margin: 10px;
            border: none;
            background-color: #00ffd5;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .button:hover {
            background-color: #00c7ac;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        .output {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fast Content AI Portal</h1>
        <p>Welcome to the cinematic content creation platform.</p>
        <textarea id="prompt" placeholder="Enter your storyline or creative prompt..."></textarea><br>
        <button class="button" onclick="generate('storyline')">Start Storyline</button>
        <button class="button" onclick="generate('script')">Generate Script</button>
        <button class="button" onclick="generate('storyboard')">Create Storyboard</button>
        <div class="output" id="outputBox" style="display:none;"></div>
    </div>

    <script>
        function generate(type) {
            const prompt = document.getElementById("prompt").value;
            const outputBox = document.getElementById("outputBox");
            let output = "";

            if (!prompt) {
                output = "⚠️ Please enter a storyline or creative prompt first.";
            } else {
                switch(type) {
                    case "storyline":
                        output = `📝 Storyline generated from: "${prompt}"\n\nA struggling father faces the impossible as he tries to keep his family afloat during hard times...`;
                        break;
                    case "script":
                        output = `🎬 Script generated for: "${prompt}"\n\nINT. SMALL APARTMENT - NIGHT\nThe room is dimly lit. Papers and bills are scattered across the kitchen table...`;
                        break;
                    case "storyboard":
                        output = `🖼️ Storyboard frame based on: "${prompt}"\n\n[Image frame placeholder: A man stands at sunrise overlooking Dubai skyline]`;
                        break;
                }
            }

            outputBox.style.display = "block";
            outputBox.innerText = output;
        }
    </script>
</body>
</html>
